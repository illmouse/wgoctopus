name: Orchestrator image

on:
  pull_request:
    paths:
      - "orchestrator/**"
      - "schema/**"
      - ".github/workflows/orchestrator-image.yml"
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "orchestrator/**"
      - "schema/**"
      - ".github/workflows/orchestrator-image.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: >-
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp
          -e PIP_CACHE_DIR=/tmp/pip -v "$PWD:/work" -w /work/orchestrator
          python:3.12-slim sh -c 'pip install -e ".[dev]" &&
          PATH=/tmp/.local/bin:$PATH pytest --cov=wgoctopus_orch
          --cov-report=term-missing --cov-fail-under=85 -q'
  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/wgoctopus-orchestrator
          tags: |
            type=ref,event=branch,enable=${{ github.ref_name == 'main' }}
            type=ref,event=branch,suffix=-latest,enable=${{ github.ref_name != 'main' }}
            type=sha,format=long,prefix=
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !endsWith(github.ref_name, 'b') }}
            type=raw,value=main-latest,enable=${{ github.ref_name == 'main' }}
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: orchestrator/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
