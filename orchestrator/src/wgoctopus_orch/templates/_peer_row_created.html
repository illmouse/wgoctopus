{% from "_components.html" import badge %}
<tr>
  <td data-label="Name">{{ peer.name }}</td><td data-label="Owner">{{ peer.owner or "—" }}</td><td data-label="Address"><code>{{ peer.allowed_ip }}</code></td>
  <td data-label="Status">{{ badge("Enabled" if peer.enabled else "Disabled", 'ok' if peer.enabled else 'muted') }}</td>
  <td data-label="Created">{{ peer.created_at }}</td>
  <td data-label="Actions"><div class="btn-list"><a class="btn btn-ghost-secondary btn-sm" href="/ui/peers/{{ peer.id }}/config" download>Download config</a></div></td>
</tr>
