{% from "_components.html" import badge %}
<tr>
  <td data-label="{{ t('peer.name') }}">{{ peer.name }}</td><td data-label="{{ t('peer.owner') }}">{{ peer.owner or "—" }}</td><td data-label="{{ t('peer.address') }}"><code>{{ peer.allowed_ip }}</code></td>
  <td data-label="{{ t('peer.status') }}">{{ badge(t("peer.enabled") if peer.enabled else t("peer.disabled"), 'ok' if peer.enabled else 'muted') }}</td>
  <td data-label="{{ t('peer.created_label') }}">{{ peer.created_at }}</td>
  <td data-label="{{ t('common.actions') }}"><div class="btn-list"><a class="btn btn-ghost-secondary btn-sm" href="/ui/peers/{{ peer.id }}/config" download>{{ t("peer.download_config") }}</a></div></td>
</tr>
