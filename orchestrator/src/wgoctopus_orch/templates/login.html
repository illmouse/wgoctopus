{% extends "base.html" %}
{% block title %}{{ t("login.page_title") }}{% endblock %}
{% block body %}
<button type="button" class="btn btn-ghost-secondary position-fixed top-0 end-0 m-3" data-theme-toggle aria-label="{{ t('common.theme_aria') }}">{{ t("common.theme") }}</button>
<div class="container container-tight py-4">
  <div class="text-center mb-4">
    <a href="/" class="navbar-brand navbar-brand-autodark">wgoctopus</a>
  </div>
  <div class="card card-md">
    <div class="card-body">
      <h2 class="card-title text-center mb-4">{{ t("login.welcome") }}</h2>
      <p class="text-secondary text-center mb-4">{{ t("login.subtitle") }}</p>
      <form id="login-form" autocomplete="on">
        <div class="mb-3">
          <label class="form-label" for="login-username">{{ t("login.username") }}</label>
          <input id="login-username" class="form-control" name="username" autocomplete="username" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label" for="login-password">{{ t("login.password") }}</label>
          <input id="login-password" class="form-control" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">{{ t("login.submit") }}</button>
        <p id="login-error" class="text-danger mt-3" role="alert" hidden></p>
      </form>
      {% if oidc %}<p class="mt-3"><a class="btn w-100" href="/auth/oidc/login">{{ t("login.sso") }}</a></p>{% endif %}
    </div>
  </div>
</div>
{% endblock %}
