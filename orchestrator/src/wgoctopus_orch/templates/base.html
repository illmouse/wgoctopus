<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}wgoctopus{% endblock %}</title>
  {% if info %}<meta name="csrf-token" content="{{ info.csrf }}">{% endif %}
  <meta name="htmx-config" content='{"includeIndicatorStyles": false}'>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
{% if info %}
<div class="app-shell">
<aside class="sidebar" id="sidebar">
  <a class="brand" href="/ui/" aria-label="wgoctopus dashboard"><span class="brand-mark">w</span><span>wgoctopus</span></a>
  <nav class="side-nav" aria-label="Main navigation">
    {% for href, label in nav %}<a href="{{ href }}"{% if path == href or (href != "/ui/" and path.startswith(href)) %} class="active" aria-current="page"{% endif %}>
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="{% if href == '/ui/' %}M3 3h8v8H3zM13 3h8v5h-8zM13 10h8v11h-8zM3 13h8v8H3z{% elif '/nodes' in href %}M12 3 3 8l9 5 9-5-9-5Zm-9 9 9 5 9-5M3 16l9 5 9-5{% elif '/instances' in href %}M4 5h16v14H4zM8 9h8m-8 4h8m-8 3h5{% elif '/failover' in href %}M7 7h13l-3-3m3 3-3 3M17 17H4l3 3m-3-3 3-3{% elif '/requests' in href %}M5 4h14v16H5zM8 8h8m-8 4h8m-8 4h5{% elif '/bootstrap' in href %}M12 3v12m-4-4 4 4 4-4M5 18v3h14v-3{% elif '/users' in href %}M16 20v-1a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v1m5-9a4 4 0 1 0 0-8 4 4 0 0 0 0 8m8-7a4 4 0 0 1 0 7m2 4a4 4 0 0 1 3 4v1{% elif '/accounts' in href %}M3 5h18v14H3zM3 9h18m-14 5h5{% else %}M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm-7 9a7 7 0 0 1 14 0{% endif %}"/></svg>
      {{ label }}</a>{% endfor %}
  </nav>
  <div class="side-bottom"><div class="who">{{ info.username }}<em>{{ info.role }}</em></div>
    <div class="side-actions"><button class="secondary sm" type="button" data-theme-toggle aria-label="Toggle color theme">◐ Theme</button><button class="ghost sm" type="button" data-logout>Log out</button></div>
  </div>
</aside>
<div class="workspace"><header class="topbar"><button class="menu-toggle secondary sm" type="button" data-menu-toggle aria-label="Open navigation" aria-expanded="false">☰</button><span class="crumb">wgoctopus</span></header>
{% else %}
<div class="login-page">
{% endif %}
<main>{% block body %}{% endblock %}</main>
{% if info %}</div></div><div class="toast-region" aria-live="polite" aria-atomic="true"></div>{% else %}</div>{% endif %}
<dialog id="confirm-dialog" aria-labelledby="confirm-title" aria-describedby="confirm-question"><h2 id="confirm-title">Confirm action</h2><p id="confirm-question"></p><form method="dialog" class="inline"><button value="cancel" class="secondary">Cancel</button><button value="confirm" class="danger">Continue</button></form></dialog>
</body>
</html>
