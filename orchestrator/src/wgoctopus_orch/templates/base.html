<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}wgoctopus{% endblock %}</title>
  {% if info %}<meta name="csrf-token" content="{{ info.csrf }}">{% endif %}
  <meta name="htmx-config" content='{"includeIndicatorStyles": false}'>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/vendor/tabler/tabler.min.css">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/theme-init.js"></script>
  <script src="/static/vendor/tabler/tabler.min.js" defer></script>
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
{% if info %}
<div class="page">
  <aside class="navbar navbar-vertical navbar-expand-lg" data-bs-theme="dark">
    <div class="container-fluid">
      <div class="navbar-brand navbar-brand-autodark">
        <a href="/ui/" aria-label="wgoctopus dashboard">wgoctopus</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#sidebar-menu" aria-controls="sidebar-menu" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
      </div>
      <div class="collapse navbar-collapse" id="sidebar-menu">
        <nav class="navbar-nav pt-lg-3" aria-label="Main navigation">
          {% for href, label in nav %}<a href="{{ href }}" class="nav-link{% if path == href or (href != "/ui/" and path.startswith(href)) %} active{% endif %}"{% if path == href or (href != "/ui/" and path.startswith(href)) %} aria-current="page"{% endif %}>
            <span class="nav-link-title">{{ label }}</span>
          </a>{% endfor %}
        </nav>
        <div class="mt-auto pt-3">
          <div class="text-secondary small px-2">{{ info.username }} · {{ info.role }}</div>
          <div class="d-flex flex-column gap-2 p-2">
            <button class="btn btn-outline-light" type="button" data-theme-toggle aria-label="Toggle color theme">◐ Theme</button>
            <button class="btn btn-ghost-light" type="button" data-logout>Log out</button>
          </div>
        </div>
      </div>
    </div>
  </aside>
  <div class="page-wrapper">
    <div class="page-body">
      <div class="container-xl">
{% else %}
<div class="page page-center">
{% endif %}
        <main>{% block body %}{% endblock %}</main>
{% if info %}
      </div>
    </div>
  </div>
</div>
<div class="toast-region" aria-live="polite" aria-atomic="true"></div>
{% else %}
</div>
{% endif %}
<dialog id="confirm-dialog" class="app-dialog" aria-labelledby="confirm-title" aria-describedby="confirm-question">
  <div class="dialog-header"><h3 class="modal-title" id="confirm-title">Confirm action</h3><button type="button" class="btn-close" data-close-dialog aria-label="Close"></button></div>
  <div class="dialog-body">
    <p id="confirm-question" class="mb-0"></p>
    <form method="dialog" class="dialog-actions"><button value="cancel" class="btn">Cancel</button><button value="confirm" class="btn btn-danger">Continue</button></form>
  </div>
</dialog>
</body>
</html>
