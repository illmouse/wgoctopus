<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}wgoctopus{% endblock %}</title>
  {% if info %}<meta name="csrf-token" content="{{ info.csrf }}">{% endif %}
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
{% if info %}
<header class="bar">
  <strong class="brand">wgoctopus</strong>
  <nav>
    {% for href, label in nav %}<a href="{{ href }}"{% if path == href or (href != "/ui/" and path.startswith(href)) %} class="active"{% endif %}>{{ label }}</a>{% endfor %}
  </nav>
  <span class="who">{{ info.username }} <em>{{ info.role }}</em> <button type="button" data-logout>Log out</button></span>
</header>
{% endif %}
<main>{% block body %}{% endblock %}</main>
</body>
</html>
