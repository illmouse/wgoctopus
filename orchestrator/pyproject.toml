[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wgoctopus-orch"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["sqlalchemy>=2", "alembic", "cryptography", "jsonschema", "asyncssh", "httpx", "fastapi", "uvicorn", "pyyaml", "pyjwt", "jinja2", "python-multipart", "qrcode>=7.4"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "pytest-asyncio", "ruff"]

[project.scripts]
wgoctopus-orch = "wgoctopus_orch.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wgoctopus_orch = ["templates/*.html", "static/*", "static/vendor/tabler/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
